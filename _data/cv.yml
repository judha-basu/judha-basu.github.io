cv:
  name: Judhajeet Basu
  label: Postdoctoral Researcher
  email: judhajeet20@gmail.com
  location: Indian Institute of Astrophysics, Bengaluru, India
  image: ""
  summary: My research centers on observational time-domain astronomy with an emphasis on novae and the role of recurrent novae in the Type Ia supernovae progenitor problem. I combine optical, UV and X-ray data to probe the physics of transients. I like to contribute to survey science and pipeline development for transient detection. I maintain active interests in fast (FXTs, FBOTs, GRBs, CVs) and slow (LRNe, CL-AGN) transients.

